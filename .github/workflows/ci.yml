name: ZAPI CI — Architecture & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architecture-scan:
    name: Architecture Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ZAPI Deep Analyzer
        run: python scripts/zapi_deep_analyzer.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Check for dangerous JS patterns
        run: |
          echo "=== Scanning for eval() ==="
          ! grep -rn --include="*.js" "\beval\s*(" extension/ || \
            (echo "FAIL: eval() found in extension JS" && exit 1)

          echo "=== Scanning for unsafe innerHTML assignments ==="
          ! grep -rn --include="*.js" "innerHTML\s*=" extension/ \
            --exclude="content-ui.js" || \
            (echo "FAIL: innerHTML assignment found outside content-ui.js" && exit 1)

          echo "=== Scanning for hardcoded API keys ==="
          ! grep -rn --include="*.js" "sk-or-[a-zA-Z0-9]" extension/ || \
            (echo "FAIL: hardcoded API key detected" && exit 1)

          echo "=== Scanning for unexpected external URLs ==="
          ! grep -rn --include="*.js" "http" extension/ \
            | grep -v "openrouter.ai" \
            | grep -v "wokwi.com" \
            | grep -v "//\s" \
            | grep -q "http" || \
            echo "INFO: All external URLs are whitelisted"

          echo "All security pattern checks passed."

      - name: Verify manifest version is set
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('extension/manifest.json')); print(d.get('version',''))")
          echo "Manifest version: $VERSION"
          [ -n "$VERSION" ] || (echo "FAIL: version missing in manifest.json" && exit 1)
          echo "Version check passed."

      - name: Verify required extension files exist
        run: |
          for f in \
            extension/manifest.json \
            extension/content-main.js \
            extension/content-ui.js \
            extension/background.js \
            extension/popup.html \
            extension/popup.js \
            extension/styles.css; do
            [ -f "$f" ] || (echo "FAIL: missing $f" && exit 1)
            echo "OK: $f"
          done
