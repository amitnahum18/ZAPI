name: ZAPI CI — Architecture & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  architecture-scan:
    name: Architecture Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ZAPI Deep Analyzer
        run: python scripts/zapi_deep_analyzer.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Check — no eval() in extension JS
        run: |
          if grep -rn --include="*.js" "eval\s*(" extension/; then
            echo "FAIL: eval() found in extension JS"
            exit 1
          fi
          echo "OK: no eval() found"

      - name: Check — no innerHTML outside content-ui.js
        run: |
          HITS=$(grep -rn --include="*.js" "innerHTML\s*=" extension/ \
            | grep -v "content-ui.js" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: innerHTML assignment found outside content-ui.js:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: innerHTML only in content-ui.js"

      - name: Check — no hardcoded API keys
        run: |
          if grep -rn --include="*.js" "sk-or-[a-zA-Z0-9]" extension/; then
            echo "FAIL: hardcoded API key detected"
            exit 1
          fi
          echo "OK: no hardcoded API keys"

      - name: Check — manifest version is set
        run: |
          VERSION=$(python3 -c "
          import json, sys
          d = json.load(open('extension/manifest.json'))
          v = d.get('version', '')
          if not v:
              sys.exit(1)
          print(v)
          ")
          echo "Manifest version: $VERSION"

      - name: Check — required extension files exist
        run: |
          MISSING=0
          for f in \
            extension/manifest.json \
            extension/content-main.js \
            extension/content-ui.js \
            extension/background.js \
            extension/popup.html \
            extension/popup.js \
            extension/styles.css; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "FAIL: missing $f"
              MISSING=1
            fi
          done
          exit $MISSING
