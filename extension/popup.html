<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 16px; background: #1a1a2e; color: #e0e0e0; width: 320px; }
    h2 { color: #7b9fff; margin: 0 0 4px; font-size: 17px; }
    .subtitle { font-size: 11px; color: #666; margin: 0 0 14px; }
    label { font-size: 12px; color: #aaa; display: block; margin: 10px 0 3px; }
    select, input {
      width: 100%; padding: 8px 10px; background: #16213e;
      border: 1px solid #3a4a7a; color: white; border-radius: 6px;
      box-sizing: border-box; font-size: 13px;
    }
    select:focus, input:focus { outline: none; border-color: #7b9fff; }
    button {
      width: 100%; padding: 10px; background: #7b9fff; border: none;
      color: white; border-radius: 6px; cursor: pointer; font-size: 14px;
      margin-top: 14px; font-weight: bold;
    }
    button:hover { background: #5a7fff; }
    .status {
      margin-top: 10px; padding: 8px 10px; border-radius: 6px;
      font-size: 13px; display: none;
    }
    .success  { background: #0d3320; color: #4cff72;  display: block; }
    .error    { background: #3d0d0d; color: #ff6b6b;  display: block; }
    .checking { background: #1a2a3a; color: #7b9fff;  display: block; }
    .row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .row input { flex: 1; margin-top: 0; }
    .eye-btn {
      width: 36px; min-width: 36px; padding: 8px 0; background: #16213e;
      border: 1px solid #3a4a7a; border-radius: 6px; cursor: pointer;
      color: #aaa; font-size: 13px; text-align: center;
    }
    .eye-btn:hover { color: white; border-color: #7b9fff; }
    .hint { font-size: 11px; color: #555; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>&#9889; ZAPI Setup</h2>
  <p class="subtitle">powered by OpenRouter</p>

  <label>מפתח API — OpenRouter</label>
  <div class="row">
    <input type="password" id="api-key" placeholder="sk-or-..." />
    <button class="eye-btn" id="toggle-key">&#128065;</button>
  </div>
  <p class="hint">קבל מפתח חינמי ב-openrouter.ai</p>

  <label>מודל</label>
  <select id="model"></select>

  <button id="save-btn">שמור והפעל</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
